<!doctype html><html lang="en"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RDG Sales Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{--bg:#F4F5F6;--surface:#FFFFFF;--ink:#1B2024;--muted:#5C6770;--line:#DCE0E4;--door:#A3252B;--door-soft:#F7E4E4;--amber:#9A5B05;--amber-soft:#FCEFD9;--green:#23724A;--green-soft:#E1F1E8;--blue:#2D5A8A;--blue-soft:#E3ECF6;--chip:#EEF0F2;
--fd:"Archivo",system-ui,sans-serif;--fb:"Public Sans",system-ui,sans-serif;--fm:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111417;--surface:#191D21;--ink:#E7EAED;--muted:#9AA5AE;--line:#2C3339;--door:#E5646A;--door-soft:#3A1C1E;--amber:#E7A94B;--amber-soft:#35270F;--green:#5CC28C;--green-soft:#15301F;--blue:#7FAEE0;--blue-soft:#172636;--chip:#23292E}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111417;--surface:#191D21;--ink:#E7EAED;--muted:#9AA5AE;--line:#2C3339;--door:#E5646A;--door-soft:#3A1C1E;--amber:#E7A94B;--amber-soft:#35270F;--green:#5CC28C;--green-soft:#15301F;--blue:#7FAEE0;--blue-soft:#172636;--chip:#23292E}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb);margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:grid;gap:32px}
a{color:inherit;text-decoration-color:var(--door);text-underline-offset:3px}
a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--door);outline-offset:2px}
header.top-bar{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:end;justify-content:space-between;border-bottom:3px solid var(--door);padding-bottom:16px}
.brand{display:grid;gap:4px}
.eyebrow{font:600 12px/1 var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:800 clamp(28px,5vw,40px)/1.05 var(--fd);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:700 20px/1.2 var(--fd);margin:0 0 12px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
h2 small{font:400 14px var(--fb);color:var(--muted)}
.meter{display:grid;gap:6px;min-width:0;flex:1 1 240px;max-width:380px}
.meter .big{font:800 34px/1 var(--fd);font-variant-numeric:tabular-nums}
.meter .big span{font-size:18px;color:var(--muted);font-weight:600}
.pips{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.pips i{height:10px;border-radius:2px;background:var(--line)}
.pips i.try{background:var(--amber)}.pips i.ok{background:var(--green)}
.stamp{font:12px var(--fm);color:var(--muted);overflow-wrap:anywhere}
ol.tops{list-style:none;margin:0;padding:0;display:grid;gap:12px}
li.top{display:grid;grid-template-columns:56px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
li.top .rank{background:var(--door);color:#fff;font:800 28px/1 var(--fd);display:flex;align-items:flex-start;justify-content:center;padding-top:18px;font-variant-numeric:tabular-nums}
li.top.is-done .rank{background:var(--green)}
li.top.gone{opacity:.6}
.body{padding:14px 18px;display:grid;gap:8px;min-width:0}
.head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
h3{font:700 19px/1.2 var(--fd);margin:0}
.meta{margin:0;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.stage,.cb,.rep,.done{font:600 11.5px/1 var(--fb);padding:4px 7px;border-radius:3px;letter-spacing:.02em;white-space:nowrap}
.st-hot{background:var(--door-soft);color:var(--door)}.st-acq{background:var(--blue-soft);color:var(--blue)}.st-ns{background:var(--amber-soft);color:var(--amber)}.st-warm{background:var(--chip);color:var(--ink)}.st-cryo{background:var(--chip);color:var(--muted)}
.cb-today,.cb-missed{background:var(--amber);color:var(--surface)}.cb-future{background:var(--amber-soft);color:var(--amber)}
.rep{background:var(--chip);color:var(--muted)}
.done.ok{background:var(--green-soft);color:var(--green)}.done.try{background:var(--amber-soft);color:var(--amber)}.done.no{background:var(--chip);color:var(--muted)}
.quote{margin:0;font-style:italic;color:var(--amber);font-size:14px}
.brief{margin:0;max-width:72ch}
.opener{margin:0;background:var(--chip);padding:8px 12px;border-radius:4px;max-width:80ch;font-size:14px}
.opener span,.obj span{display:block;font:600 11px/1.6 var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.obj{margin:0;font-size:13.5px;color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:16px;align-items:start}
@media (max-width:640px){.split{grid-template-columns:1fr}li.top{grid-template-columns:40px minmax(0,1fr)}li.top .rank{font-size:22px}.body{padding:12px}}
dl.px{margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
dl.px div{display:grid;gap:2px}dt{font:600 11px var(--fb);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}dd{margin:0;font:500 14px var(--fm);font-variant-numeric:tabular-nums}
ul.why{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
li.r{font-size:12.5px;background:var(--chip);border-radius:3px;padding:3px 7px}
li.r b{font-family:var(--fm);font-weight:600;color:var(--green)}
li.r.neg b{color:var(--door)} li.r.cbk{background:var(--amber-soft)} li.r.cbk b{color:var(--amber)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px var(--fb);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.num{font-family:var(--fm);font-variant-numeric:tabular-nums;white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.filters input,.filters select{font:14px var(--fb);padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink)}
.filters input{flex:1 1 220px}
.list{display:grid}
details.row{border-bottom:1px solid var(--line);background:var(--surface)}
details.row:first-child{border-top:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:40px minmax(0,1.6fr) 44px auto auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;font-size:14px}
summary::-webkit-details-marker{display:none}
summary .n,summary .sc{font:500 13px var(--fm);color:var(--muted);font-variant-numeric:tabular-nums}
summary .sc{color:var(--ink);font-weight:600}
summary .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
summary .lt,summary .rp{color:var(--muted);font-size:12.5px;white-space:nowrap}
summary .lt{justify-self:end}
@media (max-width:760px){summary{grid-template-columns:34px minmax(0,1fr) 40px;row-gap:4px}summary .stage,summary .cb,summary .lt,summary .rp{grid-column:2/4;justify-self:start}}
.more{padding:4px 16px 16px 62px;display:grid;gap:8px}
@media (max-width:760px){.more{padding-left:16px}}
.count{font:13px var(--fb);color:var(--muted);margin:6px 0 0}
.how{color:var(--muted);font-size:13.5px;max-width:80ch;display:grid;gap:6px}
.how p{margin:0}
@media (prefers-reduced-motion:no-preference){details.row[open] .more{animation:fade .15s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}

[hidden]{display:none!important}
html,body{overflow-x:hidden}
.wrap>*,.brand,.body,section{min-width:0}
.wrap{grid-template-columns:minmax(0,1fr)}
.gate{min-height:60vh;display:grid;place-items:center}
.gate form{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--door);border-radius:6px;padding:24px;display:grid;gap:12px;width:min(380px,100%)}
.gate h1{font-size:26px}.gate p{margin:0;color:var(--muted);font-size:14px}
.gate input[type=password]{font:16px var(--fb);padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.gate label{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.btn,.mark{font:600 13px var(--fb);border-radius:4px;cursor:pointer}
.btn{background:var(--door);color:#fff;border:0;padding:10px 14px}
.mark{background:transparent;color:var(--ink);border:1px solid var(--line);padding:5px 10px;white-space:nowrap}
.mark[aria-pressed="true"]{background:var(--green-soft);color:var(--green);border-color:transparent}
.acts{display:flex;gap:8px;align-items:center}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer}
.item.is-done{opacity:.45}
li.top.is-done .rank,li.top.is-reached .rank{background:var(--green)}
.px dd.noask{color:#8a6200;font-weight:600;font-size:13px}
.anch{margin:10px 0 0;padding:10px 12px;background:#fff8e6;border:1px solid #f0dca6;border-radius:6px;font-size:13px;line-height:1.5}
.anch span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8a6200;font-weight:700;margin-bottom:4px}
.cxl{margin:0 0 10px;font-size:13px;color:#8a2b2b}
.cxl span{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-right:6px}
.plays{margin:10px 0 0;padding:11px 13px;background:#f0f8f3;border:1px solid #cfe6d9;border-radius:6px}
.plays>span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#0b6b3a;font-weight:700;margin-bottom:6px}
.plays ul{margin:0;padding-left:18px;font-size:14px}
.plays li{margin-bottom:5px}
#gmsg{min-height:1.2em;color:var(--door)}
.more .head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
</style></head><body><div class="wrap"><div class="gate" id="gate" hidden><form id="gform" autocomplete="off"><span class="eyebrow">Red Door Guys · Sales pipeline</span><h1>Enter the passcode</h1><p>This list is locked. Ask Brian for the passcode.</p><input id="pass" type="password" aria-label="Passcode" autocomplete="current-password"><label><input id="rem" type="checkbox" checked> Remember on this device</label><button class="btn" type="submit">Unlock</button><p id="gmsg" role="status"></p></form></div><div id="app"></div></div>

<script>
(function(){
var ENC = JSON.parse(document.getElementById('enc').textContent);
var LS = { get:function(k){try{return localStorage.getItem(k)}catch(e){return null}}, set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del:function(k){try{localStorage.removeItem(k)}catch(e){}} };
var esc=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')};
var money=function(n){return n==null?'—':'$'+Math.round(n).toLocaleString('en-US')};
var fmtDate=function(iso){if(!iso)return '—';var d=new Date(iso.slice(0,10)+'T12:00:00');return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})};
var SC={'Hot ACQ':'hot','Negotiation':'hot','ACQ Manual Follow Up':'acq','No Show/Canceled':'ns','Warm Leads Dpt':'warm','CRYO':'cryo'};
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function norm(p){return String(p||'').trim().toLowerCase().replace(/\s+/g,' ')}
async function unlock(pass){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(pass)),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
  var txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(txt);
}
function stage(s){return '<span class="stage st-'+(SC[s]||'x')+'">'+esc(s)+'</span>'}
function cbBadge(cb){if(!cb||cb.kept)return '';var d=cb.dueInDays,cls='cb-future',l='Callback '+fmtDate(cb.date);
  if(d===0){cls='cb-today';l='Callback due today'+(cb.time?' · '+cb.time:'')}else if(d<0){cls='cb-missed';l='Promised '+fmtDate(cb.date)+' · '+(-d)+'d overdue'}
  return '<span class="cb '+cls+'">'+esc(l)+'</span>'}
function lastTalk(i){return i.daysSince==null?'No logged conversation':i.daysSince===0?'Talked today':'Last talked '+i.daysSince+'d ago'}
function reasons(i,n){return (i.reasons||[]).slice(0,n).map(function(r){return '<li class="r '+(r.pts<0?'neg':r.kind==='callback'?'cbk':'')+'"><b>'+(r.pts>0?'+':'')+r.pts+'</b> '+esc(r.why)+'</li>'}).join('')}
function noAsk(i){return i.ask==null||i.ask===''}
function px(i){return '<dl class="px"><div><dt>Ask</dt><dd'+(noAsk(i)?' class="noask">No ask stated':'>'+money(i.ask))+'</dd></div><div><dt>Our offer</dt><dd>'+money(i.offer)+'</dd></div><div><dt>MAO</dt><dd>'+money(i.mao)+'</dd></div></dl>'}
function anchor(i){return noAsk(i)?'<p class="anch"><span>No price on record</span>Anchor low to get one: “Other investors are paying about X for a property like that — is that in the range of what you were looking for?” Then: “I know you don’t know, but if you did know, what do you think it might be?”</p>':''}
// "Try this" is generated for every deal but stays OFF the team's page until Brian turns it on
// after the Oct/Nov test week. The switch is baked in server-side as data.showPlays
// (PIPELINE_PLAYS=1 when the pipeline runs). Brian, 2026-10-30.
var SHOW_PLAYS=false;
function plays(i){return (SHOW_PLAYS&&i.plays&&i.plays.length)?'<div class="plays"><span>Try this</span><ul>'+i.plays.slice(0,3).map(function(p){return '<li>'+esc(p)+'</li>'}).join('')+'</ul></div>':''}
function appt(i){if(i.stage!=='No Show/Canceled')return '';
  return '<p class="cxl"><span>Appointment cancelled</span>'+(i.apptDate?'was '+fmtDate(i.apptDate):'date not set')+(i.cancelReason?' · '+esc(i.cancelReason):' · no reason recorded')+'</p>'}
function todayState(i){if(!i.today)return '';if(i.today.reached)return '<span class="done ok">Reached today</span>';if(i.today.attempts)return '<span class="done try">Tried today ('+i.today.attempts+')</span>';return ''}
function doneBtn(i){return '<button type="button" class="mark" data-id="'+esc(i.id)+'" aria-pressed="false">Mark done</button>'}
function addr(i){var a=i.address||'';return (i.city&&a.toLowerCase().indexOf(String(i.city).toLowerCase())<0)?[a,i.city].filter(Boolean).join(', '):a}
function opener(i){return i.opener?'<p class="opener"><span>Open with</span>'+esc(i.opener)+'</p>':''}
function topCard(i){
  if(i.gone)return '<li class="top gone"><span class="rank">'+i.rank+'</span><div class="body"><h3>'+esc(i.name)+'</h3><p class="meta">This deal left the pipeline after the list was set.</p></div></li>';
  var q=i.callback&&!i.callback.kept&&i.callback.quote?'<p class="quote">“'+esc(i.callback.quote)+'”</p>':'';
  return '<li class="top item'+(i.today&&i.today.reached?' is-reached':'')+'" data-id="'+esc(i.id)+'"><span class="rank">'+i.rank+'</span><div class="body">'
   +'<div class="head"><h3><a href="'+esc(i.url)+'" target="_blank" rel="noopener">'+esc(i.name)+'</a></h3><div class="acts">'+todayState(i)+doneBtn(i)+'</div></div>'
   +'<p class="meta">'+stage(i.stage)+' '+cbBadge(i.callback)+' <span>'+esc(addr(i))+'</span> <span>'+lastTalk(i)+'</span>'+(i.rep!=='Ryan Kruger'?' <span class="rep">'+esc(i.rep)+'</span>':'')+'</p>'
   +appt(i)+q+'<p class="brief">'+esc(i.brief||'No notes to read yet.')+'</p>'+opener(i)+plays(i)
   +'<div class="split">'+px(i)+'<ul class="why">'+reasons(i,5)+'</ul></div>'+anchor(i)
   +(i.objections&&i.objections.length?'<p class="obj"><span>Objections</span>'+esc(i.objections.join(' · '))+'</p>':'')
   +'</div></li>'}
function row(i,k){var s=[i.name,i.address,i.city,i.zip,i.stage,i.rep,(i.motivations||[]).join(' ')].join(' ').toLowerCase();
  return '<details class="row item" data-id="'+esc(i.id)+'" data-s="'+esc(s)+'" data-stage="'+esc(i.stage)+'" data-rep="'+esc(i.rep)+'"><summary><span class="n">'+(k+1)+'</span><span class="nm">'+esc(i.name)+'</span><span class="sc">'+i.score+'</span>'+stage(i.stage)+cbBadge(i.callback)+'<span class="lt">'+lastTalk(i)+'</span><span class="rp">'+esc(i.rep)+'</span></summary>'
   +'<div class="more"><div class="head"><p class="meta"><a href="'+esc(i.url)+'" target="_blank" rel="noopener">Open in Salesforce</a> · '+esc(addr(i))+'</p>'+doneBtn(i)+'</div>'+appt(i)+'<p class="brief">'+esc(i.brief||'Not read yet.')+'</p>'+opener(i)+plays(i)+'<div class="split">'+px(i)+'<ul class="why">'+reasons(i,8)+'</ul></div>'+anchor(i)+'</div></details>'}
function render(D){SHOW_PLAYS=!!D.showPlays;
  var gen=new Date(D.generatedAt).toLocaleString('en-US',{timeZone:'America/New_York',weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  var doneKey='rdgpl-done-'+D.generatedAt; var done={}; try{done=JSON.parse(LS.get(doneKey)||'{}')}catch(e){}
  var stages=[],reps=[];D.ranked.forEach(function(i){if(stages.indexOf(i.stage)<0)stages.push(i.stage);if(reps.indexOf(i.rep)<0)reps.push(i.rep)});
  var pips=D.top10.map(function(i){return '<i class="'+(i.today&&i.today.reached?'ok':i.today&&i.today.attempts?'try':'')+'"></i>'}).join('');
  var up=D.upcoming.map(function(i){var q=(i.scheduledBy==='Callback promised in notes'&&i.callback)?('“'+(i.callback.quote||'')+'”'+(i.callback.time?' · '+i.callback.time:'')):i.scheduledBy;return '<tr><td class="num">'+esc(fmtDate(i.scheduledFor))+'</td><td><a href="'+esc(i.url)+'" target="_blank" rel="noopener">'+esc(i.name)+'</a></td><td>'+stage(i.stage)+'</td><td>'+esc(q||'')+'</td></tr>'}).join('');
  var cl=D.cleanup.map(function(i){return '<tr><td><a href="'+esc(i.url)+'" target="_blank" rel="noopener">'+esc(i.name)+'</a></td><td>'+stage(i.stage)+'</td><td>'+esc(i.rep)+'</td><td>'+esc(i.deadReason||'Notes read as dead')+'</td></tr>'}).join('');
  document.getElementById('app').innerHTML=
   '<header class="top-bar"><div class="brand"><span class="eyebrow">Red Door Guys · Sales pipeline</span><h1>'+esc(fmtDate(D.date))+'</h1><span class="stamp">Updated '+esc(gen)+' ET · '+D.counts.live+' open deals ranked · <button type="button" class="linkbtn" id="lock">Lock this device</button></span></div>'
   +'<div class="meter"><span class="eyebrow">Today\'s Top 10</span><span class="big">'+D.progress.reached+'<span> of 10 reached today · '+D.progress.attempted+' tried</span></span><div class="pips">'+pips+'</div><span class="stamp"><b>Today only — this resets at midnight, so it reads 0 first thing in the morning.</b>'+(D.progress.reachedWeek!=null?' Talked in the last 7 days: '+D.progress.reachedWeek+' of 10.':'')+' Counted from Dialpad calls in Salesforce as of '+esc(gen.split(', ').pop())+'. Reached = a conversation over 1 minute. <span id="mine"></span></span></div></header>'
   +'<section><h2>Today\'s Top 10 <small>Set at the first run this morning. It stays fixed all day.</small></h2><ol class="tops">'+D.top10.map(topCard).join('')+'</ol></section>'
   +'<section><h2>Scheduled, not due yet <small>'+D.upcoming.length+' deals parked until their follow-up date. Each one moves back into the ranking on that day.</small></h2>'+(D.upcoming.length?'<div class="panel tbl"><table><thead><tr><th>Due</th><th>Seller</th><th>Stage</th><th>Set by</th></tr></thead><tbody>'+up+'</tbody></table></div>':'<p class="count">None found in the notes.</p>')+'</section>'
   +'<section><h2>Everyone, ranked <small>Click a row for the brief</small></h2><div class="filters"><input id="q" type="search" placeholder="Search name, street, city, zip, motivation" aria-label="Search"><select id="fs" aria-label="Stage"><option value="">All stages</option>'+stages.map(function(s){return '<option>'+esc(s)+'</option>'}).join('')+'</select><select id="fr" aria-label="Rep"><option value="">All reps</option>'+reps.map(function(s){return '<option>'+esc(s)+'</option>'}).join('')+'</select></div><div class="list" id="list">'+D.ranked.map(row).join('')+'</div><p class="count" id="cnt"></p></section>'
   +'<section><h2>Check and clean up <small>'+D.cleanup.length+' deals the notes say are dead</small></h2>'+(D.cleanup.length?'<div class="panel tbl"><table><thead><tr><th>Seller</th><th>Stage</th><th>Rep</th><th>Why</th></tr></thead><tbody>'+cl+'</tbody></table></div>':'')+'</section>'
   +'<section class="how"><h2>How the ranking works</h2><p>Each update reads every open follow-up deal in Salesforce, including every note and every Dialpad AI call summary, and scores it. The biggest points come from a promised callback that is due or was missed. After that come stage, how motivated the seller sounds, how close our offer is to their price (or their price to our MAO), their timeline, equity, a competing offer, buy-box zip, and how long since anyone talked to them. Each reason and its points are on the deal.</p><p>Anything logged in Salesforce counts as a touch. A Dialpad call, answered or not, or a new note moves the seller down at the next update. Reached sellers stay down until their next follow-up is due or the callback date they gave. Tried-but-no-answer sellers come back after two days. <b>Mark done</b> greys a deal out on this device right away and clears at the next update. It does not count toward the meter; only logged Dialpad calls do.</p><p>A follow-up task in Salesforce with a future date, set by Ryan, Eddie or Greg, parks the deal in <b>Scheduled, not due yet</b> until that day. So does a callback date written in a note. On that day it comes back at the top.</p><p>Phone numbers are not on this page. Dial from Salesforce so the call is logged and counts.</p></section>';
  var list=document.getElementById('list'),rows=[].slice.call(list.children),q=document.getElementById('q'),fs=document.getElementById('fs'),fr=document.getElementById('fr'),cnt=document.getElementById('cnt');
  function applyDone(){[].slice.call(document.querySelectorAll('.item')).forEach(function(el){var on=!!done[el.dataset.id];el.classList.toggle('is-done',on);var b=el.querySelector('.mark');if(b){b.textContent=on?'Done ✓ (undo)':'Mark done';b.setAttribute('aria-pressed',on?'true':'false')}});
    var mine=document.getElementById('mine');if(mine){var n=D.top10.filter(function(i){return done[i.id]}).length;mine.textContent=n?('You marked '+n+' of the Top 10 done on this device.'):''}
    rows.filter(function(el){return done[el.dataset.id]}).forEach(function(el){list.appendChild(el)});
    rows.filter(function(el){return !done[el.dataset.id]}).reverse().forEach(function(el){list.insertBefore(el,list.firstChild)})}
  function go(){var t=(q.value||'').toLowerCase().trim(),s=fs.value,r=fr.value,n=0;rows.forEach(function(el){var ok=(!t||el.dataset.s.indexOf(t)>=0)&&(!s||el.dataset.stage===s)&&(!r||el.dataset.rep===r);el.hidden=!ok;if(ok)n++});cnt.textContent=n+' deals'}
  document.getElementById('app').addEventListener('click',function(e){var b=e.target.closest('.mark');if(!b)return;e.preventDefault();var id=b.dataset.id;if(done[id])delete done[id];else done[id]=1;LS.set(doneKey,JSON.stringify(done));applyDone()});
  q.addEventListener('input',go);fs.addEventListener('change',go);fr.addEventListener('change',go);
  document.getElementById('lock').addEventListener('click',function(){LS.del('rdgpl-pass');location.reload()});
  applyDone();go();
}
var gate=document.getElementById('gate'),form=document.getElementById('gform'),inp=document.getElementById('pass'),msg=document.getElementById('gmsg');
async function tryPass(p,remember){try{var D=await unlock(p);if(remember)LS.set('rdgpl-pass',p);gate.hidden=true;render(D);return true}catch(e){return false}}
form.addEventListener('submit',async function(e){e.preventDefault();msg.textContent='Unlocking…';var ok=await tryPass(inp.value,document.getElementById('rem').checked);if(!ok){msg.textContent='That passcode didn\'t work. Check the spelling and try again.';inp.select()}});
var saved=LS.get('rdgpl-pass');if(saved){tryPass(saved,false).then(function(ok){if(!ok){LS.del('rdgpl-pass');gate.hidden=false}})}else{gate.hidden=false;inp.focus()}
})();</script></body></html>
